name: potato-windows

# Project Potato Switch 2: a self-contained Windows x86_64 build of the potato fork.
# Runs on every push to nx2 (that is the build), on potato-* tags, and on demand.
on:
  workflow_dispatch:
  push:
    branches: [nx2]
    tags:
      - "potato-*"
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/windows/**"
      - "cpmfile.json"
      - ".github/workflows/potato-windows.yml"

permissions:
  contents: read

concurrency:
  group: potato-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x86_64 (AVX2)
    runs-on: windows-2022
    timeout-minutes: 120
    # ccache, as in build-check: sccache has no direct mode for clang-cl.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify shader compiler
        shell: pwsh
        run: glslangValidator --version

      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/cpm
            .ccache
          key: potato-clang-cl-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            potato-clang-cl-${{ runner.os }}-

      # /arch:AVX2 rather than the znver3 preset: clang-cl's CPU selection is coarse, and a
      # binary built with -march=znver3 would fault on any host older than Zen 3. The znver3
      # preset is for local GCC/clang builds of this fork.
      - name: Configure
        run: >-
          cmake -S . -B build/potato -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          "-DCMAKE_C_FLAGS=/arch:AVX2 -DWIN32 -D_WINDOWS -DNOMINMAX"
          "-DCMAKE_CXX_FLAGS=/arch:AVX2 -DWIN32 -D_WINDOWS -EHsc -DNOMINMAX"
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DENABLE_QT=ON
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      - name: Build
        env:
          CCACHE_COMPILERCHECK: string:${{ hashFiles('tools/windows/install-llvm.ps1') }}
        run: |
          set -euo pipefail
          ccache --zero-stats
          cmake --build build/potato --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $bin = 'build/potato/bin'
          foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
            if (-not (Test-Path "$bin/$exe")) {
              throw "$bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations "$bin/lichii.exe"
          $name = 'project-potato-switch-2-windows-x86_64'
          Compress-Archive -Path "$bin/*" -DestinationPath "$name.zip" -CompressionLevel Optimal
          Get-Item "$name.zip" | Format-List Name, Length

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: project-potato-switch-2-windows-x86_64
          path: project-potato-switch-2-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/cpm
            .ccache
          key: potato-clang-cl-${{ runner.os }}-${{ github.sha }}
